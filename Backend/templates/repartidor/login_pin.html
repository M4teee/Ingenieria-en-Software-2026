{% extends "base.html" %}
{% load static %}

{% block title %}Ingreso repartidor{% endblock %}

{% block extrastyle %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock extrastyle %}

{% block content %}
    <div class="auth-card">
        <h1 class="h3 mb-1">Ingreso de repartidor</h1>
        <p class="text-secondary mb-4">Ingresá tu PIN de acceso.</p>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="pin" class="form-label fw-semibold">PIN</label>
            <input
                type="password"
                id="pin"
                name="pin"
                class="form-control"
                inputmode="numeric"
                autocomplete="off"
                minlength="4"
                maxlength="4"
                pattern="[0-9]{4}"
                required
            >
            <button type="submit" class="btn btn-app w-100 mt-3">Ingresar</button>
        </form>
    </div>
{% endblock %}
