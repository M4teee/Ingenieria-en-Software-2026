{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Iniciar sesión{% endblock %}

{% block extrastyle %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock extrastyle %}

{% block content %}
    <div class="auth-card">
        <h1 class="h3 mb-1">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Ingresá con tu usuario y contraseña.</p>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-app w-100 mt-2">Iniciar sesión</button>
        </form>
    </div>
{% endblock %}
