{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
    <div class="auth-card">
        <h1 class="h3 mb-1">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Ingresá con tu usuario y contraseña.</p>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-app w-100 mt-2">Iniciar sesión</button>
        </form>

        <p class="text-center mt-4 mb-0">
            ¿No tenés cuenta? <a href="/register">Registrate acá</a>
        </p>
    </div>
{% endblock %}
