{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | Pedidos Martín</title>
    <link rel="shortcut icon" href="{% static 'Logo 512x512.webp' %}" type="image/webp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extrastyle%}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand navbar-app">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'root' %}">
                <img src="{% static 'Logo Full Resolution.webp' %}" alt="Logo" width="40" height="40">
                Pedidos Martín
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="navbar-user d-none d-sm-inline">
                        <i class="bi bi-person-circle"></i> {{ user.get_username }}
                    </span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-app-outline">
                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                        </button>
                    </form>
                {% else %}
                    <a href="/login" class="btn btn-sm btn-app">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main id="content" class="container flex-grow-1 py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer-app text-center py-3">
        <small>© Pedidos Martín</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
