{% load static %}<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172033">
    <title>{% block title %}{% endblock %} | SGR</title>
    <link rel="icon" href="{% static 'sgr/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="{% static 'vendor/basecoat/1.1.0/basecoat.cdn.min.css' %}">
    <link rel="stylesheet" href="{% static 'sgr/sgr.css' %}">
    {% block extrastyle %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#content">Saltar al contenido</a>
    {% block body %}
        <main id="content">{% block content %}{% endblock %}</main>
    {% endblock %}
    {% include "components/mensajes.html" %}
    <script src="{% static 'vendor/basecoat/1.1.0/js/basecoat.min.js' %}" defer></script>
    <script src="{% static 'sgr/sgr.js' %}" defer></script>
    {% block extrascript %}{% endblock %}
</body>
</html>
